name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  api-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Unit tests
        run: PYTHONPATH=. pytest -q

  eval-recorded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Recorded eval
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          PYTHONPATH=eval pytest -q eval/tests
          python eval/evaluate.py --mode recorded --model oracle --output eval/reports/oracle.json
          python eval/report.py --models oracle,MiniMax-M3 --output-dir eval/reports

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
