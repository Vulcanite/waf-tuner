# WAF Tuner — lab stack
#
# LLM / secrets: lab-data/.env (mounted via env_file — edit & recreate backend)
# Paths: fixed below for the shared volume layout
#
#   cp lab-data/.env.example lab-data/.env   # or use your NIM keys
#   docker compose up --build
#   open http://localhost:3000
#   open http://localhost:8080               # DVWA admin / password
#   ./scripts/run_incident_matrix.sh

networks:
  waf-net:
    driver: bridge

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: waf-lab-nginx
    volumes:
      - ./lab-data:/shared
      - ./lab-data:/waf-data
      - ./lab-data/modsec:/var/log/modsec
    networks:
      - waf-net
    ports:
      - "8080:8080"
    environment:
      BACKEND: "http://dvwa:80"
      PORT: "8080"
      SSL_PORT: "8443"
      MODSEC_RULE_ENGINE: "DetectionOnly"
      PARANOIA: "2"
      EXECUTING_PARANOIA: "2"
      ANOMALY_INBOUND: "10"
      ANOMALY_OUTBOUND: "4"
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG: "/var/log/modsec/audit.log"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      MODSEC_AUDIT_LOG_TYPE: "Serial"
      MODSEC_AUDIT_LOG_PARTS: "ABCFHIJKZ"
      MODSEC_REQ_BODY_ACCESS: "On"
      MODSEC_RESP_BODY_ACCESS: "On"
      WAF_SHARED_DIR: "/shared"
    depends_on:
      - dvwa
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: waf-lab-dvwa
    networks:
      - waf-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  waf-tuner-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waf-tuner-backend
    volumes:
      - ./lab-data:/shared
      - ./lab-data:/waf-data
    networks:
      - waf-net
    ports:
      - "8000:8000"
    # LLM keys, agent concurrency, fingerprint, etc.
    env_file:
      - path: ./lab-data/.env
        required: true
    environment:
      # Lab filesystem layout (override host-relative DATABASE_PATH from .env)
      MODSEC_AUDIT_LOG: /shared/modsec/audit.log
      EVENTS_JSONL_PATH: /shared/events.jsonl
      AUDIT_CURSOR_PATH: /shared/audit_cursor.json
      DATABASE_PATH: /shared/waf-tuner.db
      RUNTIME_CONFIG_PATH: /shared/runtime_config.json
      CRS_RULES_DIR: /shared/crs-rules/
      # Structure-only validation (no edge nginx -t)
      RULE_VALIDATION_MODE: skip
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  waf-tuner-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waf-tuner-frontend
    networks:
      - waf-net
    ports:
      - "3000:3000"
    depends_on:
      waf-tuner-backend:
        condition: service_healthy
