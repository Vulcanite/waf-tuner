# CRS Setup Configuration

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Paranoia Level 2 — catches most common attacks while minimizing FP for tuning demo
SecAction \
  "id:900000,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  setvar:tx.paranoia_level=2"

# Enable extra paranoia level features for testing
SecAction \
  "id:900001,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  setvar:tx.executing_paranoia_level=2"

# Anomaly scoring thresholds
SecAction \
  "id:900110,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  setvar:tx.inbound_anomaly_score_threshold=10,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# HTTP policy settings
SecAction \
  "id:900200,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

SecAction \
  "id:900220,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|'"
