# Server block only — this is copied to /etc/nginx/conf.d/default.conf
# The main /etc/nginx/nginx.conf from the base image is preserved so that
# the ModSecurity dynamic module is loaded correctly.

server {
    listen 80;
    server_name _;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

    # Agent-generated exception rules from the waf-data shared volume
    include /etc/nginx/modsecurity/exceptions/exception_*.conf;

    location / {
        proxy_pass http://target-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
